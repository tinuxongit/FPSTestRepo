name: Source snapshot
on:
  push:
    branches: [polish/city-mission]
    paths: [.github/workflows/source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: tar --exclude=.git -czf /tmp/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: /tmp/source.tar.gz
          retention-days: 2
